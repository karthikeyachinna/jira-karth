# GoCD pipeline-as-code (yaml.config.plugin). Registered via gocd/setup.py.
#
#                  ┌─▶ jira-space-DEV   ─┐
#                  ├─▶ jira-space-QS    ─┤
#   jira-connect ──┼─▶ jira-space-SCR   ─┼──▶ jira-release-approval (manual) ──▶ Confluence
#   (this file)    ├─▶ jira-space-SCRUM ─┤
#                  └─▶ jira-space-SUP   ─┘
#
# The jira-space-* and jira-release-approval pipelines are generated by the connect-jira job
# (python -m jira_release sync) through the GoCD API, one per Jira space it finds.
# Secrets (JIRA_TOKEN, OPENAI_API_KEY) are NOT here: they are secure variables on the
# GoCD environment "jira-release", created by gocd/setup.py from your local .env.
format_version: 10
environments:
  jira-release:
    pipelines:
      - jira-connect
pipelines:
  jira-connect:
    group: jira
    label_template: "${COUNT}"
    lock_behavior: unlockWhenFinished
    display_order: 1
    materials:
      repo:
        git: https://github.com/karthikeyachinna/jira-karth.git
        branch: main
    stages:
      - connect-jira:
          clean_workspace: true
          jobs:
            connect-jira:
              artifacts:
                - build:
                    source: output/workspaces.*
                    destination: spaces
              tabs:
                spaces: spaces/workspaces.md
              tasks:
                - exec:
                    command: gocd/run.sh
                    arguments: [check]
                - exec:
                    command: gocd/run.sh
                    arguments: [sync]
