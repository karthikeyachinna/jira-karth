# GoCD pipeline-as-code (yaml.config.plugin). Registered via gocd/setup.py.
#
#   jira-connect  ──▶  jira-release-spaces
#   (this file)        stage "spaces":   one parallel job per Jira space (space-DEV, space-SCRUM, ...)
#                      stage "approval": manual approval, then publish to Confluence
#
# jira-release-spaces is generated by the connect-jira job (python -m jira_release sync)
# through the GoCD API, because the number of jobs depends on the Jira spaces found.
# Secrets (JIRA_TOKEN, OPENAI_API_KEY) are NOT here: they are secure variables on the
# GoCD environment "jira-release", created by gocd/setup.py from your local .env.
format_version: 10
environments:
  jira-release:
    pipelines:
      - jira-connect
pipelines:
  jira-connect:
    group: jira
    label_template: "${COUNT}"
    lock_behavior: unlockWhenFinished
    display_order: 1
    materials:
      repo:
        git: https://github.com/karthikeyachinna/jira-karth.git
        branch: main
    stages:
      - connect-jira:
          clean_workspace: true
          jobs:
            connect-jira:
              artifacts:
                - build:
                    source: output/workspaces.*
                    destination: spaces
              tabs:
                spaces: spaces/workspaces.md
              tasks:
                - exec:
                    command: gocd/run.sh
                    arguments: [check]
                - exec:
                    command: gocd/run.sh
                    arguments: [sync]
